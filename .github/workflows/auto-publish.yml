name: AI Affiliate Auto Publisher

on:
  schedule:
    - cron: '0 1 * * *'    # 8:00 sang Viet Nam (UTC+7)
    - cron: '0 7 * * *'    # 14:00 trua Viet Nam
    - cron: '0 13 * * *'   # 20:00 toi Viet Nam
  workflow_dispatch:         # Nut bam chay thu cong tren GitHub

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Publish 5 articles (balanced across niches, high-commission first)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          AMAZON_AFFILIATE_TAG: ${{ secrets.AMAZON_AFFILIATE_TAG }}
          NORDVPN_AFF_ID: ${{ secrets.NORDVPN_AFF_ID }}
          HOSTINGER_REF: ${{ secrets.HOSTINGER_REF }}
          CLICKBANK_ID: ${{ secrets.CLICKBANK_ID }}
          BLOG_URL: ""
          BLOG_API_SECRET: ""
        run: python publish_balanced.py 5

      - name: Fix affiliate links (ensure no signup-page URLs)
        env:
          AMAZON_AFFILIATE_TAG: ${{ secrets.AMAZON_AFFILIATE_TAG }}
          NORDVPN_AFF_ID: ${{ secrets.NORDVPN_AFF_ID }}
          HOSTINGER_REF: ${{ secrets.HOSTINGER_REF }}
          CLICKBANK_ID: ${{ secrets.CLICKBANK_ID }}
        run: python fix_affiliate_links.py

      - name: Fix broken href="#" placeholder links
        env:
          AMAZON_AFFILIATE_TAG: ${{ secrets.AMAZON_AFFILIATE_TAG }}
          NORDVPN_AFF_ID: ${{ secrets.NORDVPN_AFF_ID }}
          HOSTINGER_REF: ${{ secrets.HOSTINGER_REF }}
          CLICKBANK_ID: ${{ secrets.CLICKBANK_ID }}
        run: python fix_broken_links.py

      - name: Generate static site (GitHub Pages)
        env:
          GA4_ID: ${{ secrets.GA4_ID }}
          ADSENSE_PUB_ID: ${{ secrets.ADSENSE_PUB_ID }}
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          GOOGLE_SITE_VERIFICATION: ${{ secrets.GOOGLE_SITE_VERIFICATION }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          AMAZON_AFFILIATE_TAG: ${{ secrets.AMAZON_AFFILIATE_TAG }}
          SITE_URL: ${{ secrets.SITE_URL || 'https://voha6898-stack.github.io/ai-affiliate-system' }}
          SITE_NAME: ${{ secrets.SITE_NAME || 'AI Tool Reviewer' }}
        run: python generate_site.py

      - name: Post to Pinterest (skip if token not set)
        env:
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_DEFAULT_BOARD_ID: ${{ secrets.PINTEREST_DEFAULT_BOARD_ID }}
          PINTEREST_BOARD_IDS: ${{ secrets.PINTEREST_BOARD_IDS }}
          SITE_URL: ${{ secrets.SITE_URL || 'https://voha6898-stack.github.io/ai-affiliate-system' }}
          SITE_NAME: ${{ secrets.SITE_NAME || 'AIToolReviewer.com' }}
        run: |
          if [ -n "$PINTEREST_ACCESS_TOKEN" ] && [ -n "$PINTEREST_DEFAULT_BOARD_ID" ]; then
            python pinterest_auto.py --limit 15
          else
            echo "Pinterest secrets not set — skipping (set PINTEREST_ACCESS_TOKEN + PINTEREST_DEFAULT_BOARD_ID)"
          fi

      - name: Deploy to GitHub Pages
        run: |
          git config user.email "ai-bot@github-actions.com"
          git config user.name "AI Affiliate Bot"
          git add data/ docs/
          git diff --staged --quiet || git commit -m "auto: publish articles $(date '+%Y-%m-%d %H:%M') UTC"
          git push || true
